version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latexed-api-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://latexed:${POSTGRES_PASSWORD}@db:5432/latexed
      - DEBUG=false
      - DEPLOYMENT_ENV=production
      - AUTH_MODE=${AUTH_MODE:-trusted_proxy}
      - TRUSTED_USER_HEADER=${TRUSTED_USER_HEADER:-X-Latexed-User}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS}
      - ALLOW_PRODUCTION_LOCAL_AUTH=${ALLOW_PRODUCTION_LOCAL_AUTH:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ORIGINS=["https://app.latexted.ru"]
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - latexed_data:/tmp/latexed_uploads
      - latexed_compiles:/tmp/latexed_compiles
      - latexed_exports:/tmp/latexed_uploads/exports
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: latexed-db
    environment:
      - POSTGRES_USER=latexed
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=latexed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latexed -d latexed"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: latexed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: latexed-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    restart: always

  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latexed-generation-worker
    command: >
      bash -c "
        cd /app &&
        python -m app.workers.generation_worker --recover-stale
      "
    environment:
      - DATABASE_URL=postgresql+psycopg2://latexed:${POSTGRES_PASSWORD}@db:5432/latexed
      - REDIS_URL=redis://redis:6379/0
      - AI_GENERATION_JOB_WORKER_ENABLED=true
      - AI_GENERATION_JOB_STALE_AFTER_SECONDS=${AI_GENERATION_JOB_STALE_AFTER_SECONDS:-1800}
      - DEPLOYMENT_ENV=production
      - AUTH_MODE=${AUTH_MODE:-trusted_proxy}
      - TRUSTED_USER_HEADER=${TRUSTED_USER_HEADER:-X-Latexed-User}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS}
      - ALLOW_PRODUCTION_LOCAL_AUTH=${ALLOW_PRODUCTION_LOCAL_AUTH:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - latexed_data:/tmp/latexed_uploads
      - latexed_compiles:/tmp/latexed_compiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  latexed_data:
  latexed_compiles:
  latexed_exports:
