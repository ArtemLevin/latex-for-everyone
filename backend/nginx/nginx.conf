upstream latexed_backend {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS (uncomment in production)
    # return 301 https://$host$request_uri;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=compile:10m rate=2r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client body size
    client_max_body_size 50M;

    # Health check
    location /api/health {
        proxy_pass http://latexed_backend;
        # Drop any user-supplied trusted identity header by default.
        # Authenticated deployments should replace this with a proxy-derived identity, e.g. $remote_user.
        proxy_set_header X-Latexed-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API routes with rate limiting
    location /api/compile {
        limit_req zone=compile burst=5 nodelay;
        proxy_pass http://latexed_backend;
        # Drop any user-supplied trusted identity header by default.
        # Authenticated deployments should replace this with a proxy-derived identity, e.g. $remote_user.
        proxy_set_header X-Latexed-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for compilation
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    location /api/export {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://latexed_backend;
        # Drop any user-supplied trusted identity header by default.
        # Authenticated deployments should replace this with a proxy-derived identity, e.g. $remote_user.
        proxy_set_header X-Latexed-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # General API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://latexed_backend;
        # Drop any user-supplied trusted identity header by default.
        # Authenticated deployments should replace this with a proxy-derived identity, e.g. $remote_user.
        proxy_set_header X-Latexed-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Docs (disable in production)
    location /api/docs {
        proxy_pass http://latexed_backend;
        # Drop any user-supplied trusted identity header by default.
        # Authenticated deployments should replace this with a proxy-derived identity, e.g. $remote_user.
        proxy_set_header X-Latexed-User "";
        proxy_set_header Host $host;
    }

    location /api/redoc {
        proxy_pass http://latexed_backend;
        # Drop any user-supplied trusted identity header by default.
        # Authenticated deployments should replace this with a proxy-derived identity, e.g. $remote_user.
        proxy_set_header X-Latexed-User "";
        proxy_set_header Host $host;
    }

    # Static files (if serving frontend from same server)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

