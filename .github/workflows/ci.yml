name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: latexed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: make sync

      - name: Python syntax check
        run: make compileall

      - name: Backend lint
        run: make lint

      - name: Backend format check
        run: make format-check

      - name: Backend tests
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/latexed_test
          SECRET_KEY: test-secret-key
        run: make test

  frontend-static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend syntax check
        run: make frontend-check

  docker-build:
    needs: [backend-quality, frontend-static]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t latexed-api:${{ github.sha }} backend

  publish:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t latexed-api:${{ github.sha }} backend

      - name: Login to Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: |
          docker tag latexed-api:${{ github.sha }} registry.example.com/latexed-api:latest
          docker push registry.example.com/latexed-api:latest
